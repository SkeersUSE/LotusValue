name: Update currency rates

on:
  workflow_dispatch:
  schedule:
    # Около полуночи по Москве. GitHub предупреждает о возможных
    # задержках scheduled jobs, поэтому ставим 00:05.
    - cron: "5 0 * * *"
      timezone: "Europe/Moscow"
    # Дополнительная проверка каждый час: если новый курс ЦБ
    # появился позже 00:05, он подтянется автоматически.
    - cron: "35 * * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch official CBR rates
        shell: python
        run: |
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://www.cbr.ru/scripts/XML_daily.asp"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "LotusCurrencyUpdater/1.0",
                  "Accept": "application/xml,text/xml,*/*",
              },
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          rates = {}
          for valute in root.findall("Valute"):
              code = valute.findtext("CharCode", "").strip()
              nominal = float(valute.findtext("Nominal", "1").replace(",", "."))
              value = float(valute.findtext("Value", "0").replace(",", "."))

              if code in ("USD", "EUR"):
                  rates[code] = value / nominal

          if "USD" not in rates or "EUR" not in rates:
              raise RuntimeError("CBR XML does not contain USD/EUR")

          payload = {
              "source": "Банк России",
              "date": root.attrib.get("Date"),
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "rates": {
                  "USD": round(rates["USD"], 6),
                  "EUR": round(rates["EUR"], 6),
              },
          }

          with open("rates.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(json.dumps(payload, ensure_ascii=False, indent=2))

      - name: Commit updated rates
        run: |
          git config user.name "lotus-rates-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json

          if git diff --cached --quiet; then
            echo "No rate changes to commit."
            exit 0
          fi

          git commit -m "chore: update currency rates"
          git push
