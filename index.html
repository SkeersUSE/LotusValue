<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Lotus — курс валют</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    :root{
      --pink:#ff3bd4;
      --pink2:#ff73c8;
      --text:#090909;
      --muted:#b6b6b9;
      --bg:#fff;
      --card:#fff;
      --line:#111;
      --soft:#f7f7f8;
      --shadow: 0 10px 30px rgba(255, 0, 220, .16);
      --radius:34px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;min-height:100dvh}

    button,input{font:inherit}
    button{cursor:pointer}

    .app{
      width:min(1180px,100%);
      margin:0 auto;
      padding:
        max(30px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:24px;
      margin-bottom:42px;
    }

    .brand h1{
      margin:0;
      font-size:clamp(64px,9vw,132px);
      line-height:.76;
      letter-spacing:-.075em;
      font-weight:500;
      color:var(--pink2);
    }

    .brand p{
      margin:28px 0 0 4px;
      font-size:clamp(25px,3vw,43px);
      line-height:1;
      font-weight:800;
      letter-spacing:-.04em;
    }

    .status{
      display:flex;
      align-items:center;
      gap:9px;
      margin-top:10px;
      color:#777;
      font-size:13px;
      white-space:nowrap;
    }

    .dot{
      width:9px;height:9px;border-radius:50%;
      background:#27c76f;
      box-shadow:0 0 0 5px rgba(39,199,111,.12);
    }
    .dot.loading{background:#ffb000;box-shadow:0 0 0 5px rgba(255,176,0,.12)}
    .dot.error{background:#ff3b30;box-shadow:0 0 0 5px rgba(255,59,48,.12)}

    .rates{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:108px;
    }

    .card-wrap{
      position:relative;
      min-width:0;
    }

    .rate-card{
      position:relative;
      min-width:0;
      padding:30px;
      border:5px solid var(--line);
      border-radius:44px;
      background:var(--card);
      box-shadow:12px 12px 0 var(--pink);
      transition:transform .18s ease, box-shadow .18s ease;
    }

    .rate-card:hover{
      transform:translateY(-2px);
      box-shadow:15px 15px 0 var(--pink);
    }

    .pair{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:22px;
      min-height:125px;
      font-size:clamp(45px,6vw,74px);
      font-weight:900;
      letter-spacing:-.07em;
    }

    .pair .arrow{
      font-size:.65em;
      letter-spacing:0;
    }

    .rate-line{
      margin-top:15px;
      text-align:center;
      font-size:clamp(22px,2.5vw,31px);
      font-weight:800;
    }

    .rate-line span{color:#777;font-weight:500}

    .converter{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      gap:12px;
      align-items:center;
      margin-top:26px;
    }

    .amount-wrap{
      border:2px solid #171717;
      border-radius:20px;
      padding:12px 15px;
      background:#fff;
    }

    .amount-wrap label{
      display:block;
      font-size:11px;
      text-transform:uppercase;
      color:#999;
      font-weight:800;
      letter-spacing:.08em;
      margin-bottom:5px;
    }

    .amount{
      width:100%;
      border:0;
      outline:0;
      font-size:22px;
      font-weight:800;
      background:transparent;
      min-width:0;
    }

    .result{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:22px;
      font-weight:900;
    }

    .swap{
      width:54px;height:54px;
      border:3px solid #111;
      border-radius:50%;
      background:#fff;
      box-shadow:5px 5px 0 var(--pink);
      display:grid;
      place-items:center;
      font-size:26px;
      transition:.15s;
    }
    .swap:hover{transform:rotate(180deg)}
    .swap:active{transform:scale(.94)}

    .refresh{
      position:absolute;
      right:-86px;
      top:50%;
      transform:translateY(-50%);
      width:72px;height:72px;
      border:4px solid #111;
      border-radius:50%;
      background:#fff;
      box-shadow:7px 7px 0 var(--pink);
      display:grid;
      place-items:center;
      font-size:38px;
      font-weight:900;
      line-height:1;
    }

    .refresh.spinning{animation:spin .7s linear infinite}
    .refresh:hover{transform:translateY(-50%) scale(1.04)}
    .refresh:active{transform:translateY(-50%) scale(.94)}
    @keyframes spin{to{transform:rotate(360deg)}}

    footer{
      margin-top:38px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:20px;
    }

    .update{
      color:#b9b9bb;
      font-size:clamp(17px,2vw,25px);
      font-weight:800;
      letter-spacing:-.03em;
      text-transform:uppercase;
    }

    .source{
      color:#9a9a9d;
      font-size:12px;
      text-align:right;
      max-width:400px;
      line-height:1.4;
    }

    .source a{color:#777}

    .notice{
      margin-top:18px;
      display:none;
      padding:13px 16px;
      border-radius:18px;
      background:#fff2f2;
      color:#b42318;
      font-size:13px;
      font-weight:700;
    }

    @media (max-width:800px){
      .app{padding-top:max(24px,env(safe-area-inset-top))}
      header{margin-bottom:30px}
      .brand h1{font-size:clamp(62px,19vw,100px)}
      .brand p{margin-top:22px;font-size:25px}
      .status{font-size:11px;margin-top:7px}
      .rates{grid-template-columns:1fr;gap:28px}
      .card-wrap{padding-right:74px}
      .rate-card{padding:25px;border-radius:34px;box-shadow:9px 9px 0 var(--pink)}
      .refresh{right:0;top:50%;width:60px;height:60px;font-size:31px}
      .pair{min-height:105px;padding-right:45px;font-size:clamp(40px,13vw,62px)}
      .converter{grid-template-columns:1fr auto 1fr}
      footer{display:block}
      .source{text-align:left;margin-top:10px}
    }

    @media (max-width:430px){
      .app{padding-left:17px;padding-right:17px}
      .brand h1{font-size:74px}
      .brand p{font-size:23px;max-width:250px;line-height:1.05}
      .rate-card{border-width:4px;padding:21px;border-radius:30px}
      .card-wrap{padding-right:66px}
      .refresh{right:0;top:50%;width:55px;height:55px;box-shadow:5px 5px 0 var(--pink)}
      .pair{font-size:45px;gap:13px;padding-right:40px}
      .rate-line{font-size:21px}
      .converter{gap:7px}
      .swap{width:47px;height:47px;font-size:22px;border-width:2px;box-shadow:4px 4px 0 var(--pink)}
      .amount-wrap{padding:10px 11px;border-radius:16px}
      .amount,.result{font-size:18px}
      .update{font-size:16px}
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1>Lotus</h1>
        <p>курс валюты ТО</p>
      </div>
      <div class="status" id="status">
        <i class="dot loading" id="statusDot"></i>
        <span id="statusText">получаем курс…</span>
      </div>
    </header>

    <section class="rates">
      <div class="card-wrap">
        <article class="rate-card" data-currency="EUR">
        <div class="pair"><span class="from">EUR</span><span class="arrow">↔</span><span class="to">RUB</span></div>
        <div class="rate-line"><span>1 EUR = </span><strong id="eurRate">—</strong><span> ₽</span></div>

        <div class="converter">
          <div class="amount-wrap">
            <label class="amount-label">EUR</label>
            <input class="amount" inputmode="decimal" value="1" aria-label="Сумма евро">
          </div>
          <button class="swap" aria-label="Поменять направление">↔</button>
          <div class="amount-wrap">
            <label class="result-label">RUB</label>
            <div class="result">—</div>
          </div>
        </div>
        </article>
        <button class="refresh" aria-label="Обновить курс евро" title="Обновить">↻</button>
      </div>

      <div class="card-wrap">
        <article class="rate-card" data-currency="USD">
        <div class="pair"><span class="from">USD</span><span class="arrow">↔</span><span class="to">RUB</span></div>
        <div class="rate-line"><span>1 USD = </span><strong id="usdRate">—</strong><span> ₽</span></div>

        <div class="converter">
          <div class="amount-wrap">
            <label class="amount-label">USD</label>
            <input class="amount" inputmode="decimal" value="1" aria-label="Сумма долларов">
          </div>
          <button class="swap" aria-label="Поменять направление">↔</button>
          <div class="amount-wrap">
            <label class="result-label">RUB</label>
            <div class="result">—</div>
          </div>
        </div>
        </article>
        <button class="refresh" aria-label="Обновить курс доллара" title="Обновить">↻</button>
      </div>
    </section>

    <div class="notice" id="notice"></div>

    <footer>
      <div class="update" id="updateText">курсы валют обновляются ежедневно</div>
      <div class="source">
        Источник курсов: <b>Банк России (ЦБ РФ)</b>.<br>
        rates.json автоматически обновляет GitHub Actions; позже сюда можно добавить курсы конкретных туроператоров.
      </div>
    </footer>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#ffffff'); tg.setBackgroundColor('#ffffff'); } catch(e) {}
    }

    // GitHub Pages: курс хранится в rates.json и обновляется GitHub Actions.
    // Cache-busting не позволяет Telegram/браузеру долго держать старый JSON.
    const API = './rates.json';
    const POLL_MS = 5 * 60 * 1000;

    const state = {
      rates: { USD: null, EUR: null },
      date: null,
      lastFetch: null
    };

    async function loadRates(manual=false){
      setStatus('loading', manual ? 'обновляем курс…' : 'получаем курс…');
      const buttons = cards.map(c => $('.refresh', c));
      buttons.forEach(b => b.classList.add('spinning'));
      $('#notice').style.display = 'none';

      try{
        const response = await fetch(`${API}?t=${Date.now()}`, {
          cache:'no-store'
        });

        if(!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();

        if(!data?.rates?.USD || !data?.rates?.EUR || !data?.date){
          throw new Error('Некорректный rates.json');
        }

        state.rates.USD = Number(data.rates.USD);
        state.rates.EUR = Number(data.rates.EUR);
        state.date = data.date;
        state.lastFetch = new Date();

        localStorage.setItem('lotusRates', JSON.stringify({
          rates: state.rates,
          date: state.date,
          savedAt: state.lastFetch.toISOString()
        }));

        renderAll();
        setStatus('', `ЦБ РФ • ${state.date}`);
      }catch(err){
        console.error('Lotus rates:', err);

        const cached = localStorage.getItem('lotusRates');

        if(cached){
          try{
            const old = JSON.parse(cached);
            state.rates = old.rates;
            state.date = old.date;
            state.lastFetch = new Date(old.savedAt);
            renderAll();

            setStatus('error', 'показан сохранённый курс');
            $('#notice').textContent =
              'Новый курс пока недоступен. Показаны последние сохранённые значения.';
            $('#notice').style.display = 'block';
          }catch(e){
            showRateError();
          }
        }else{
          showRateError();
        }
      }finally{
        buttons.forEach(b => b.classList.remove('spinning'));
      }
    }

    function showRateError(){
      setStatus('error', 'курс пока недоступен');
      $('#notice').textContent =
        'rates.json ещё не обновлён. Запусти GitHub Action «Update currency rates» — после первого запуска здесь появится официальный курс Банка России.';
      $('#notice').style.display = 'block';
    }

    function setupCard(card){
      const swap = $('.swap', card);
      const input = $('.amount', card);

      input.addEventListener('input', () => renderCard(card));

      swap.addEventListener('click', () => {
        const a = $('.amount-label', card);
        const b = $('.result-label', card);
        const old = a.textContent;
        a.textContent = b.textContent;
        b.textContent = old;
        renderCard(card);
      });

      $('.refresh', card).addEventListener('click', () => loadRates(true));
    }

    cards.forEach(setupCard);

    // Официальное обновление выполняет GitHub Actions.
    // Пока Mini App открыт, мы перечитываем rates.json каждые 5 минут.

    loadRates();
    setInterval(() => loadRates(false), POLL_MS);

    // Re-fetch when the Mini App becomes visible again.
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRates(false);
    });
  </script>
</body>
</html>
